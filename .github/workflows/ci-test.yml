name: CI - Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies (allow legacy peers)
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Run lint
        run: npm run lint
      - name: Run rich test suite
        run: npm run test:ci
        env:
          CI: true
